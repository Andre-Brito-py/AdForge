# Verificação a cada push e pull request: tipos, lint, testes (inclusive os de banco, num Postgres
# descartável do próprio GitHub) e o build de produção. Não usa nenhum segredo nem o banco de produção.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vysify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável do job (nunca o de produção).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vysify_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/vysify_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vysify_test
      # Valores de mentira, só para o build e os testes (nenhum serviço externo é chamado).
      NEXTAUTH_SECRET: ci-only-not-a-secret
      ENCRYPTION_KEY: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar as migrations no banco de teste
        run: npx prisma migrate deploy

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
